version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assurance-pro-auto
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/database.sqlite
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/public/uploads:/var/www/html/public/uploads
    networks:
      - assurance-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: MySQL for production
  mysql:
    image: mysql:8.0
    container_name: assurance-pro-auto-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: assurance
      MYSQL_USER: assurance
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - assurance-net
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Optional: Redis for caching/queues
  redis:
    image: redis:7-alpine
    container_name: assurance-pro-auto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - assurance-net
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  assurance-net:
    driver: bridge